<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGenius AI | Neural OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --sidebar: #0a0a0a; --accent: #38bdf8; --border: rgba(255,255,255,0.08); --text: #ececec; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        
        /* LEFT: CHAT HISTORY (ChatGPT Style) */
        .chat-history { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; }
        .new-chat-btn { border: 1px solid var(--border); padding: 12px; border-radius: 8px; text-align: left; cursor: pointer; font-size: 13px; margin-bottom: 20px; transition: 0.3s; }
        .new-chat-btn:hover { background: rgba(255,255,255,0.05); }
        .history-list { flex: 1; overflow-y: auto; font-size: 13px; color: #888; }
        .history-item { padding: 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .history-item:hover { background: rgba(255,255,255,0.03); color: #fff; }

        /* CENTER: MAIN AREA */
        .main-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        #main-viewport { flex: 1; padding: 40px; overflow-y: auto; }
        .chat-input-area { padding: 20px 100px; background: linear-gradient(transparent, var(--bg)); }
        .input-box { background: #151515; border: 1px solid var(--border); padding: 18px; border-radius: 15px; width: 100%; color: white; outline: none; }

        /* RIGHT: ELITE TOOLS (Our Secret Weapon) */
        .tool-sidebar { width: 300px; background: var(--sidebar); border-left: 1px solid var(--border); padding: 20px; }
        .tool-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
        .tool-card:hover { border-color: var(--accent); transform: translateX(-5px); }
        .tool-label { font-size: 10px; color: var(--accent); font-weight: 800; letter-spacing: 1px; margin-bottom: 5px; }
        
        .btn-action { background: var(--accent); color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <aside class="chat-history">
        <div class="new-chat-btn"> + New Thread</div>
        <p style="font-size:10px; font-weight:800; color:#555; margin-bottom:10px;">YOUR CHATS</p>
        <div class="history-list">
            <div class="history-item">Quantum Physics Notes</div>
            <div class="history-item">Math Pattern Analysis</div>
            <div class="history-item">Board Exam Strategy</div>
        </div>
    </aside>

    <main class="main-container">
        <header style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;">
            <span style="font-weight:800; letter-spacing:1px;">STUDYGENIUS <span style="color:var(--accent)">AI</span></span>
            <div id="clock" style="color:var(--accent); font-family:monospace;">00:00:00</div>
        </header>

        <div id="main-viewport">
            </div>

        <div class="chat-input-area">
            <input type="text" class="input-box" placeholder="Ask anything to the Neural Engine...">
        </div>
    </main>

    <aside class="tool-sidebar">
        <p style="font-size:10px; font-weight:800; color:#555; margin-bottom:20px;">ELITE MODULES</p>
        
        <div class="tool-card" onclick="navigate('scanner')">
            <p class="tool-label">VISION_SCANNER</p>
            <p style="font-size:12px;">Digitize & Extract Notes</p>
        </div>

        <div class="tool-card" onclick="navigate('analytics')">
            <p class="tool-label">20_YEAR_ANALYZER</p>
            <p style="font-size:12px;">Pattern Repetition: 94%</p>
        </div>

        <div class="tool-card" onclick="navigate('dash')">
            <p class="tool-label">NEURAL_DASHBOARD</p>
            <p style="font-size:12px;">Global Student Stats</p>
        </div>

        <div class="tool-card">
            <p class="tool-label">ACTIVE_RECALL</p>
            <p style="font-size:12px;">Memory Vault Active</p>
        </div>

        <button class="btn-action" style="width:100%; margin-top:20px;">EXECUTE GLOBAL SYNC</button>
    </aside>

    <script src="app.js"></script>
</body>
</html>

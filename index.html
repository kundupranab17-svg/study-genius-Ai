<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGenius AI | The ChatGPT Killer</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
 :root {
    --bg-dark: #020617;
    --glass: rgba(15, 23, 42, 0.6);
    --glass-border: rgba(255, 255, 255, 0.08);
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.3);
    --text-main: #f1f5f9;
    --text-dim: #94a3b8;
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    overflow: hidden;
    /* Background Glows */
    background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
}

/* SIDEBAR: Modern Glass Look */
.sidebar {
    width: 280px;
    background: var(--glass);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    padding: 40px 24px;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 60px;
}

.logo img {
    width: 45px;
    height: 45px;
    filter: drop-shadow(0 0 10px var(--accent-glow)); /* Logo Glowing effect */
}

.logo span {
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(to right, #fff, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* NAV LINKS: Floating effect */
.nav-link {
    padding: 16px 20px;
    margin-bottom: 12px;
    border-radius: 16px;
    cursor: pointer;
    color: var(--text-dim);
    font-weight: 600;
    transition: 0.3s all cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    align-items: center;
    gap: 15px;
}

.nav-link:hover, .nav-link.active {
    background: rgba(255, 255, 255, 0.05);
    color: var(--accent);
    transform: translateX(5px);
    border: 1px solid var(--glass-border);
}

/* MAIN CONTENT */
.main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
}

header {
    height: 90px;
    padding: 0 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(2, 6, 23, 0.5);
    backdrop-filter: blur(10px);
}

.viewport {
    flex: 1;
    padding: 50px;
    overflow-y: auto;
}

/* BUTTON: Ultra Premium Glow */
.btn-upgrade {
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    color: #fff;
    padding: 12px 28px;
    border-radius: 14px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    box-shadow: 0 10px 25px -5px var(--accent-glow);
    transition: 0.4s;
}

.btn-upgrade:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px -5px var(--accent-glow);
}

/* SCROLLBAR (Custom for God-Mode) */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="SG">
            <span>STUDYGENIUS AI</span>
        </div>

        <ul class="nav-menu">
            <li class="nav-link active" onclick="navigate('dash')">📊 Dashboard</li>
            <li class="nav-link" onclick="navigate('exams')">🛡️ AI Mock Exams</li>
            <li class="nav-link" onclick="navigate('notes')">🧠 Smart Notes</li>
            <li class="nav-link" onclick="navigate('pricing')">💎 Pricing</li>
        </ul>

        <div class="status-card">
            <p style="font-size:12px; color:var(--text-gray);">Current Status</p>
            <p class="status-val">FREE TIER</p>
        </div>
    </aside>

    <div class="main-wrapper">
        <header>
            <div style="color:var(--text-gray); font-size:14px;">System: <span style="color:#10b981;">Online</span></div>
            <button class="btn-upgrade" onclick="navigate('pricing')">GO PRO</button>
        </header>
        
        <div class="viewport" id="main-viewport">
            </div>
    </div>

    <script src="app.js"></script>

</body>
</html>

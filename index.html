<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGenius AI | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050810;
            --sidebar: rgba(13, 17, 28, 0.95);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.2);
            --border: rgba(255, 255, 255, 0.06);
            --text: #ffffff;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(139, 92, 246, 0.05) 0px, transparent 50%);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar: Professional & Slim */
        .sidebar {
            width: 260px;
            background: var(--sidebar);
            backdrop-filter: blur(30px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 35px 20px;
            z-index: 100;
        }

        .logo { 
            display: flex; align-items: center; gap: 12px; margin-bottom: 45px; padding-left: 10px;
        }
        .logo-icon { width: 32px; height: 32px; background: var(--accent); border-radius: 8px; box-shadow: 0 0 15px var(--accent-glow); }
        .logo span { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }

        .nav-group { margin-bottom: 30px; }
        .nav-label { font-size: 10px; color: var(--text-dim); letter-spacing: 1.5px; font-weight: 700; margin-bottom: 15px; padding-left: 10px; text-transform: uppercase; }

        .nav-link {
            padding: 14px 16px;
            margin-bottom: 4px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-dim);
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(255, 255, 255, 0.03);
            color: var(--accent);
            border: 1px solid var(--border);
        }

        /* Main Area */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; position: relative; }

        header {
            height: 70px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 8, 16, 0.5);
            backdrop-filter: blur(10px);
        }

        #main-viewport { flex: 1; padding: 40px; overflow-y: auto; scroll-behavior: smooth; }

        /* Premium Buttons */
        .btn-primary {
            background: var(--accent);
            color: #000;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--accent-glow); }

        /* Cards & Components */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 24px;
            transition: 0.3s;
        }
        .glass-card:hover { border-color: rgba(56, 189, 248, 0.3); background: rgba(255, 255, 255, 0.04); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-icon"></div>
            <span>STUDYGENIUS <span style="color:var(--accent)">AI</span></span>
        </div>

        <div class="nav-group">
            <p class="nav-label">Main Menu</p>
            <div class="nav-link active" onclick="navigate('dash')">📊 Overview</div>
            <div class="nav-link" onclick="navigate('notes')">🧠 AI Smart Notes</div>
            <div class="nav-link" onclick="navigate('exams')">🛡️ AI Mock Exams</div>
        </div>

        <div class="nav-group">
            <p class="nav-label">Analytics</p>
            <div class="nav-link" onclick="navigate('stats')">📈 Study Progress</div>
        </div>

        <div style="margin-top: auto; padding: 20px; background: rgba(56, 189, 248, 0.05); border-radius: 15px; border: 1px solid var(--border);">
            <p style="font-size: 11px; color: var(--accent); font-weight: 800;">PRO PLAN</p>
            <p style="font-size: 12px; margin-top: 5px;">Unlimited AI Access</p>
        </div>
    </aside>

    <div class="main-wrapper">
        <header>
            <div style="font-size: 13px; color: var(--text-dim);">Status: <span style="color: #10b981; font-weight: 800;">GOD MODE ACTIVE</span></div>
            <div id="system-clock" style="font-weight: 700; color: var(--accent); font-family: monospace; font-size: 16px;">00:00:00</div>
        </header>
        <div id="main-viewport"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural OS | StudyGenius</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0d0d0d;
            --sidebar-bg: #000000;
            --accent: #38bdf8;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #e5e5e5;
            --text-dim: #a3a3a3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* --- LEFT SIDEBAR (CHATGPT STYLE) --- */
        .sidebar-left {
            width: 260px; background: var(--sidebar-bg); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 12px;
        }

        .new-chat-trigger {
            border: 1px solid var(--border-color); border-radius: 8px; padding: 10px;
            display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s;
            font-size: 14px; font-weight: 500; margin-bottom: 20px;
        }
        .new-chat-trigger:hover { background: rgba(255,255,255,0.05); }

        .history-section { flex: 1; overflow-y: auto; }
        .history-label { font-size: 11px; font-weight: 700; color: #555; margin: 20px 0 10px 10px; letter-spacing: 0.5px; }
        .history-item {
            padding: 10px; border-radius: 6px; font-size: 13px; color: var(--text-dim);
            cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .history-item:hover { background: #171717; color: #fff; }

        /* --- CENTER AREA --- */
        .viewport-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); position: relative; }
        #content-area { flex: 1; overflow-y: auto; padding: 40px 15% 100px 15%; } /* Standard Chat Width */

        .input-wrapper {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 20px 15% 40px 15%; background: linear-gradient(transparent, var(--bg-main) 30%);
        }
        .pill-input-container {
            background: #1a1a1a; border: 1px solid var(--border-color); border-radius: 24px;
            padding: 12px 20px; display: flex; align-items: center; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .pill-input-container input {
            flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 15px;
        }

        /* --- RIGHT SIDEBAR (THE ELITE TOOLSET) --- */
        .sidebar-right {
            width: 300px; border-left: 1px solid var(--border-color); background: var(--sidebar-bg);
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
        }
        .module-card {
            background: #111; border: 1px solid var(--border-color); padding: 15px; border-radius: 12px;
            cursor: pointer; transition: 0.3s;
        }
        .module-card:hover { border-color: var(--accent); transform: scale(1.02); }
        .module-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .module-tag { font-size: 9px; font-weight: 900; color: var(--accent); letter-spacing: 1px; }

        /* --- UTILS --- */
        .svg-icon { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    </style>
</head>
<body>

    <aside class="sidebar-left">
        <div class="new-chat-trigger">
            <svg class="svg-icon"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            New Intelligence Thread
        </div>
        
        <div class="history-section">
            <p class="history-label">RECENT CHATS</p>
            <div class="history-item" onclick="loadChat('Quantum Electrodynamics')">
                <svg class="svg-icon" style="width:14px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Quantum Electrodynamics
            </div>
            <div class="history-item" onclick="loadChat('Organic Patterns 2026')">
                <svg class="svg-icon" style="width:14px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Organic Patterns 2026
            </div>
        </div>
    </aside>

    <main class="viewport-main">
        <div id="content-area">
            </div>

        <div class="input-wrapper">
            <div class="pill-input-container">
                <svg class="svg-icon" style="color:var(--text-dim)"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                <input type="text" id="userInput" placeholder="Ask your Neural Guide...">
                <button style="background:var(--accent); border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; display:flex; align-items:center; justify-content:center;">
                    <svg class="svg-icon" style="stroke:black; width:16px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
            </div>
        </div>
    </main>

    <aside class="sidebar-right">
        <p class="history-label" style="margin-left:0;">NEURAL MODULES</p>
        
        <div class="module-card" onclick="render('scanner')">
            <div class="module-header">
                <svg class="svg-icon" style="color:var(--accent)"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                <span class="module-tag">VISION_EXTRACTOR</span>
            </div>
            <p style="font-size:12px; color:var(--text-dim);">Digitize handwritten notes via Neural OCR.</p>
        </div>

        <div class="module-card" onclick="render('analytics')">
            <div class="module-header">
                <svg class="svg-icon" style="color:var(--accent)"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                <span class="module-tag">PATTERN_ANALYZER</span>
            </div>
            <p style="font-size:12px; color:var(--text-dim);">20-Year historical board trends mapping.</p>
        </div>

        <div class="module-card" onclick="render('dash')">
            <div class="module-header">
                <svg class="svg-icon" style="color:var(--accent)"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                <span class="module-tag">NEURAL_DASHBOARD</span>
            </div>
            <p style="font-size:12px; color:var(--text-dim);">Global student ranking & stats.</p>
        </div>
    </aside>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGenius AI | Elite Neural OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #020617; --sidebar: #0f172a; --accent: #38bdf8; --border: rgba(255, 255, 255, 0.06); --text-main: #f8fafc; --text-dim: #94a3b8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
        .sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 25px; z-index: 10; }
        .nav-group { margin-bottom: 20px; }
        .nav-label { font-size: 10px; color: var(--text-dim); font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; padding-left: 10px; }
        .nav-link { padding: 12px 15px; border-radius: 12px; cursor: pointer; color: var(--text-dim); font-size: 13px; font-weight: 600; transition: 0.2s; display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
        .nav-link:hover, .nav-link.active { background: rgba(56, 189, 248, 0.1); color: var(--accent); }
        .main-wrapper { flex: 1; display: flex; flex-direction: column; }
        header { height: 70px; padding: 0 40px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: rgba(2, 6, 23, 0.8); backdrop-filter: blur(10px); }
        #main-viewport { flex: 1; padding: 40px; overflow-y: auto; scroll-behavior: smooth; opacity: 1; transition: 0.3s; }
        .glass-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 20px; padding: 25px; }
        .btn-action { background: var(--accent); color: #000; padding: 14px 24px; border-radius: 12px; font-weight: 800; border: none; cursor: pointer; transition: 0.3s; }
        .btn-action:hover { box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); transform: translateY(-2px); }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 35px;">
            <svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
            <span style="font-size: 18px; font-weight: 900; letter-spacing: -0.5px;">STUDY<span style="color:var(--accent)">GENIUS</span></span>
        </div>

        <div class="nav-group">
            <p class="nav-label">Neural Engine</p>
            <div class="nav-link active" onclick="navigate('dash')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg> Overview</div>
            <div class="nav-link" onclick="navigate('scanner')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg> AI Scanner</div>
            <div class="nav-link" onclick="navigate('notes')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line></svg> Smart Notes</div>
        </div>

        <div class="nav-group">
            <p class="nav-label">Exam Crusher</p>
            <div class="nav-link" onclick="navigate('analytics')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> 20-Year Analysis</div>
            <div class="nav-link" onclick="navigate('exams')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg> Mock Exams</div>
            <div class="nav-link" onclick="navigate('practice')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path></svg> Practice Sets</div>
        </div>

        <div class="nav-group">
            <p class="nav-label">Scholar OS</p>
            <div class="nav-link" onclick="navigate('planner')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line></svg> Study Planner</div>
            <div class="nav-link" onclick="navigate('focus')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Focus Mode</div>
        </div>
    </aside>

    <div class="main-wrapper">
        <header>
            <div style="font-size: 13px; color: var(--text-dim); font-weight: 600;">Neural Link: <span style="color:var(--accent)">Active</span></div>
            <div id="clock" style="color: var(--accent); font-family: monospace; font-weight: 800; font-size: 18px;">00:00:00</div>
        </header>
        <div id="main-viewport"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGenius AI | God Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020617;
            --accent: #38bdf8;
            --glass: rgba(15, 23, 42, 0.8);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f1f5f9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px;
            background: var(--glass);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
        .logo img { width: 40px; height: 40px; border-radius: 8px; }
        .logo span { font-size: 18px; font-weight: 800; color: var(--accent); }

        .nav-link {
            padding: 14px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            color: #94a3b8;
            transition: 0.3s;
            list-style: none;
        }

        .nav-link.active, .nav-link:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
        }

        /* MAIN */
        .main-wrapper { flex: 1; display: flex; flex-direction: column; }
        
        header {
            height: 70px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        #main-viewport { flex: 1; padding: 40px; overflow-y: auto; }

        .btn-upgrade {
            background: var(--accent);
            color: #000;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        /* Dashboard Styles */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 25px; border-radius: 20px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="SG">
            <span>STUDYGENIUS AI</span>
        </div>
        <ul style="list-style: none;">
            <li class="nav-link active" onclick="app.navigate('dash')">📊 Dashboard</li>
            <li class="nav-link" onclick="app.navigate('exams')">🛡️ AI Mock Exams</li>
            <li class="nav-link" onclick="app.navigate('notes')">🧠 Smart Notes</li>
            <li class="nav-link" onclick="app.navigate('pricing')">💎 Pricing</li>
        </ul>
    </aside>

    <div class="main-wrapper">
        <header>
            <div style="color:#94a3b8">System: <span style="color:#10b981">Online</span></div>
            <button class="btn-upgrade">GO PRO</button>
        </header>
        <div id="main-viewport">
            </div>
    </div>

    <script>
        // God-Mode Logic
        const app = {
            viewport: document.getElementById('main-viewport'),
            
            pages: {
                dash: `
                    <div class="stat-grid">
                        <div class="card"><h3>84%</h3><p>Knowledge</p></div>
                        <div class="card"><h3>#12</h3><p>Global Rank</p></div>
                        <div class="card"><h3>128h</h3><p>Focus Time</p></div>
                    </div>
                `,
                notes: `
                    <h2>Smart AI Notes</h2>
                    <div style="display:flex; gap:10px; margin-top:20px;">
                        <input id="topic" style="flex:1; padding:15px; background:#1e293b; border:1px solid #334155; border-radius:10px; color:white;">
                        <button class="btn-upgrade" onclick="app.generate()">GENERATE</button>
                    </div>
                    <div id="output" style="margin-top:20px;"></div>
                `,
                exams: `<h2>AI Mock Exams</h2><p>Coming Soon...</p>`,
                pricing: `<h2>Elite Plans</h2><p>Upgrade for $49/mo</p>`
            },

            navigate(pageId) {
                this.viewport.innerHTML = this.pages[pageId];
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                event.currentTarget.classList.add('active');
            },

            generate() {
                const t = document.getElementById('topic').value;
                document.getElementById('output').innerHTML = "AI is thinking...";
                setTimeout(() => {
                    document.getElementById('output').innerHTML = "Notes for " + t + ": High quality content generated!";
                }, 1500);
            }
        };

        // Initial Load
        window.onload = () => app.navigate('dash');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGenius AI | The ChatGPT Killer</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #030712;
            --panel: rgba(17, 24, 39, 0.7);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.4);
            --text-white: #f9fafb;
            --text-gray: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 50%);
        }

        /* Sidebar Design */
        .sidebar {
            width: 280px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 40px 24px;
            z-index: 10;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -0.5px;
            margin-bottom: 48px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-menu { list-style: none; flex: 1; }

        .nav-link {
            padding: 14px 18px;
            margin-bottom: 8px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-gray);
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
        }

        /* Main Content Viewport */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            height: 80px;
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .viewport {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .btn-upgrade {
            background: var(--accent);
            color: #000;
            padding: 10px 22px;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px var(--accent-glow);
            transition: 0.3s;
        }

        .btn-upgrade:hover { transform: scale(1.05); }

        /* Animations */
        .page-enter { animation: slideUp 0.4s ease-out; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <div style="width:12px; height:12px; background:var(--accent); border-radius:3px; box-shadow:0 0 10px var(--accent);"></div>
            STUDYGENIUS AI
        </div>
        <ul class="nav-menu">
            <li class="nav-link active" onclick="navigate('dash')">📊 Dashboard</li>
            <li class="nav-link" onclick="navigate('exams')">🛡️ AI Mock Exams</li>
            <li class="nav-link" onclick="navigate('notes')">🧠 Smart Notes</li>
            <li class="nav-link" onclick="navigate('pricing')">💎 Pricing</li>
        </ul>
        <div style="margin-top:auto; padding:20px; background:rgba(255,255,255,0.03); border-radius:15px; border:1px solid var(--border);">
            <p style="font-size:12px; color:var(--text-gray);">Current Status</p>
            <p style="font-size:14px; font-weight:700; color:var(--accent);">FREE TIER</p>
        </div>
    </aside>

    <div class="main-wrapper">
        <header>
            <div style="color:var(--text-gray); font-size:14px;">System: <span style="color:#10b981;">Online</span></div>
            <button class="btn-upgrade" onclick="navigate('pricing')">GO PRO</button>
        </header>
        <div class="viewport" id="main-viewport">
            </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

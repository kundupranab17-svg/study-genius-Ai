<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyGenius AI | The ChatGPT Killer</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
:root {
    --bg-dark: #020617;
    --glass: rgba(15, 23, 42, 0.7);
    --glass-border: rgba(255, 255, 255, 0.08);
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.3);
    --text-main: #f1f5f9;
    --text-dim: #94a3b8;
    --panel: rgba(30, 41, 59, 0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    height: 100vh;
    display: flex; /* Sidebar aur Main ko bagal mein rakhne ke liye */
    overflow: hidden;
    background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 40%);
}

/* Sidebar Fix */
.sidebar {
    width: 280px;
    height: 100vh;
    background: var(--glass);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    padding: 40px 24px;
    flex-shrink: 0;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 50px;
}

.logo img { width: 42px; height: 42px; object-fit: contain; }
.logo span { font-size: 20px; font-weight: 800; color: var(--accent); }

/* Main Wrapper Fix */
.main-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

header {
    height: 80px;
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(2, 6, 23, 0.3);
}

.viewport {
    flex: 1;
    padding: 40px;
    overflow-y: auto;
    position: relative;
}

/* Dashboard Cards (Huge Look) */
.glass-panel {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 25px;
    margin-bottom: 20px;
}

.stat-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--glass-border);
    padding: 25px;
    border-radius: 20px;
    transition: 0.3s;
}

.stat-card:hover { border-color: var(--accent); transform: translateY(-5px); }

.progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin-top: 15px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }

.chart-bar { flex: 1; background: rgba(255,255,255,0.1); border-radius: 5px 5px 0 0; }

/* Navigation */
.nav-menu { list-style: none; }
.nav-link {
    padding: 14px 18px;
    margin-bottom: 8px;
    border-radius: 12px;
    cursor: pointer;
    color: var(--text-dim);
    transition: 0.3s;
    display: flex;
    align-items: center;
    gap: 12px;
}
.nav-link.active, .nav-link:hover {
    background: rgba(56, 189, 248, 0.1);
    color: var(--accent);
}

/* Buttons */
.btn-upgrade {
    background: var(--accent);
    color: #000;
    padding: 10px 22px;
    border-radius: 10px;
    font-weight: 700;
    border: none;
    cursor: pointer;
    box-shadow: 0 0 20px var(--accent-glow);
}

/* Animations */
.page-enter { animation: slideUp 0.4s ease-out; }
@keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="SG">
            <span>STUDYGENIUS AI</span>
        </div>

        <ul class="nav-menu">
            <li class="nav-link active" onclick="navigate('dash')">📊 Dashboard</li>
            <li class="nav-link" onclick="navigate('exams')">🛡️ AI Mock Exams</li>
            <li class="nav-link" onclick="navigate('notes')">🧠 Smart Notes</li>
            <li class="nav-link" onclick="navigate('pricing')">💎 Pricing</li>
        </ul>

        <div class="status-card">
            <p style="font-size:12px; color:var(--text-gray);">Current Status</p>
            <p class="status-val">FREE TIER</p>
        </div>
    </aside>

    <div class="main-wrapper">
        <header>
            <div style="color:var(--text-gray); font-size:14px;">System: <span style="color:#10b981;">Online</span></div>
            <button class="btn-upgrade" onclick="navigate('pricing')">GO PRO</button>
        </header>
        
        <div class="viewport" id="main-viewport">
            </div>
    </div>

    <script src="app.js"></script>

</body>
</html>
